plugins {
    id 'com.android.application'
}

android {
    // AGP 8+ 要求 namespace（原 manifest package 属性移到这里）；改名后包为 com.cimoc.newhook
    namespace "com.cimoc.newhook"
    // libxposed api 102.0.0 的 AAR 声明 minCompileSdk=37
    compileSdk 37

    defaultConfig {
        applicationId "com.cimoc.newhook"
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName "1.7.276"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        // AGP 8+ 默认关闭 BuildConfig，MainHook 用到 BuildConfig.DEBUG
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        // 本模块经 LSPosed 仓库分发，不上架 Google Play；
        // AGP 9 的 lintVitalRelease 会因 targetSdk 32 报 ExpiredTargetSdkVersion 中断 release 构建
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    // 旧版: compileOnly 'de.robv.android.xposed:api:82'（含 :sources）
    // 新版: 现代 LibXposed API 102
    compileOnly 'io.github.libxposed:api:102.0.0'
    compileOnly 'androidx.annotation:annotation:1.9.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}

apply from: rootProject.file('gradle/signing.gradle')
